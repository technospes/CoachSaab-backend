name: Keep Render Alive
on:
  schedule:
    # Runs every 3 minutes from 8:30 AM to 11:29 PM IST
    # Survives GitHub's worst-case 10-minute queue delays
    - cron: '*/3 3-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://coachsaab-api.onrender.com/api/v1/health
