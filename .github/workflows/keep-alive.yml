name: Keep Render Alive
on:
  schedule:
    # Runs every 5 minutes.
    # 3-17 UTC roughly translates to 8:30 AM to 11:30 PM IST.
    - cron: '*/5 3-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://coachsaab-api.onrender.com/api/v1/health
